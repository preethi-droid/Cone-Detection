general:
  camera_model: 'zed2i'
  grab_resolution: 'HD720'
  grab_frame_rate: 60

depth:
  depth_mode: 'PERFORMANCE'
  depth_stabilization: true
  minimum_distance: 0.3

video:
  auto_exposure_gain: true

object_detection:
  od_enabled: true
  model_type: 'CUSTOM_BOX_OBJECTS'
  enable_tracking: true
